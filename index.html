
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <title>人狼ゲーム</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <div class="app-shell">

    <header class="app-header">
      <div class="brand-mark">☾</div>

      <h1>人狼ゲーム</h1>

      <p class="subtitle">
        闇に潜む人狼を見つけ出せ。
      </p>
    </header>

    <main class="game-card">

      <div id="game">
        <h2>プレイヤー数を選択</h2>

        <p>3〜20人でゲームを開始できます。</p>

        <label class="field-label" for="count">
          参加人数
        </label>

        <div class="number-field">
          
<div class="count-selector">
  <button id="initial-count-minus" class="count-adjust" type="button">−</button>

  <div class="count-display">
    <input type="number" id="count" min="3" max="20" value="6">
    <span>人</span>
  </div>

  <button id="initial-count-plus" class="count-adjust" type="button">＋</button>
</div>

          <span>人</span>
        </div>


<a class="online-mode-link" href="./online.html">
  オンラインで遊ぶ
</a>


        <button id="start">
          次へ進む →
        </button>
      </div>

    </main>

  </div>

</body>
</html>
