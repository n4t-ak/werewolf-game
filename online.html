
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>オンライン人狼</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>オンライン人狼</h1>
      <p class="subtitle">
        自分のスマホからルームに参加
      </p>
    </header>

    <section class="game-card">
      <div id="online-game">

        <div id="entry-screen">
          <h2>オンラインルーム</h2>

          <label class="field-label" for="online-name">
            プレイヤー名
          </label>
          <input id="online-name"
                 type="text"
                 maxlength="20"
                 placeholder="名前を入力"
                 autocomplete="nickname">

          <button id="create-room">
            新しいルームを作成
          </button>

          <label class="field-label" for="room-code">
            ルーム番号
          </label>
          <input id="room-code"
                 type="text"
                 inputmode="numeric"
                 maxlength="6"
                 placeholder="6桁の番号">

          <button id="join-room">
            ルームに参加
          </button>
        </div>

        <div id="lobby-screen" hidden>
          <h2>ルーム待機画面</h2>
          <p>ルーム番号</p>
          <div id="display-room-code"></div>

          <button id="copy-room-link">
            招待リンクをコピー
          </button>

          <h3 id="member-count">参加者</h3>
          <div id="online-members"></div>

          <p id="lobby-notice">
            全員が参加するまで待ってください。
          </p>
          
<!-- ホスト専用の役職設定 -->
<div id="online-role-settings" hidden>
  <h3>役職設定</h3>
  <p>各役職の人数を設定してください。</p>

  <div id="online-role-list"></div>

  <p id="online-villager-count"></p>

  <label class="online-check-label">
    <input type="checkbox" id="online-role-missing">
    役職欠けを有効にする
  </label>

  <p id="online-role-error" role="alert"></p>

  <button id="online-start-game">
    役職を配布してゲームを開始
  </button>

</div>
<!-- ここで lobby-screen を閉じる -->

<!-- 全員共通の役職確認画面 -->
<div id="online-role-reveal" hidden>
  <h3>あなたの役職</h3>

  <div class="online-role-card">
    <strong id="online-my-role">確認中...</strong>
    <p id="online-my-role-description"></p>
  </div>

  <button id="online-ready-button">
    役職を確認しました
  </button>

  <h3 id="online-ready-count">確認状況</h3>
  <div id="online-ready-members"></div>

  <p class="online-wait-message">
    全員の役職確認が終了するまで待機してください。
  </p>
</div>


<!-- 全員共通の役職確認画面 -->
<div id="online-role-reveal" hidden>
  <h3>あなたの役職</h3>

  <div class="online-role-card">
    <strong id="online-my-role">確認中...</strong>
    <p id="online-my-role-description"></p>
  </div>

  <button id="online-ready-button">
    役職を確認しました
  </button>

  <h3 id="online-ready-count">確認状況</h3>
  <div id="online-ready-members"></div>

  <p class="online-wait-message">
    全員の役職確認が終了するまで待機してください。
  </p>
</div>

        </div>

        <p id="online-status" role="status"></p>
      </div>
    </section>

    
<footer class="app-footer">
  <a href="./index.html" class="online-back-button">
    ← 1台モードへ戻る
  </a>
</footer>

  </main>

  <script type="module" src="./online.js"></script>
</body>
</html>
