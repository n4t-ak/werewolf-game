<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c101d">
  <title>人狼ゲーム | WEREWOLF</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  
<link rel="stylesheet" href="seer-result.css?v=20261027">

</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">☾</div>
      <p class="eyebrow">ONE DEVICE · ALL PLAYERS</p>
      <h1>人狼ゲーム</h1>
      <p class="subtitle">闇に潜む人狼を見つけ出せ。</p>
    </header>
    <section class="game-card" aria-label="ゲーム操作">
      <div id="game">
        <h2>プレイヤー数を選択</h2>
        <p>3〜20人でゲームを開始できます。</p>
        <label for="count" class="field-label">参加人数</label>
        <div class="number-field">
          <input type="number" id="count" min="3" max="20" step="1" value="5" inputmode="numeric">
          <span>人</span>
        </div>
        <button id="start" type="button">次へ進む →</button>
      </div>
    </section>
    <footer class="app-footer">PASS THE PHONE · KEEP YOUR ROLE SECRET</footer>
  </main>
</body>
</html>
